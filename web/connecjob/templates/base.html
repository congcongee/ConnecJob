<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>{% block title %}ConnecJob{% endblock %} | ConnecJob</title>
</head>
<body>
  {% include "header.html" %}
  <main class="container py-4">
    {% for m in messages %}
      <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}" role="alert">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% include "footer.html" %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // AI 호출은 수십 초 걸림 → 제출 버튼을 막고 진행 중 표시 (중복 제출 방지)
    document.querySelectorAll("form[data-loading]").forEach(f => f.addEventListener("submit", e => {
      f.querySelectorAll("button[type=submit]").forEach(b => b.disabled = true);
      const s = e.submitter;
      if (s) { s.insertAdjacentHTML("afterbegin", '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>');
               if (s.name) f.insertAdjacentHTML("beforeend", `<input type="hidden" name="${s.name}" value="${s.value}">`); }
      f.querySelector("[data-loading-msg]")?.classList.remove("d-none");
    }));
  </script>
</body>
</html>
